# alobocekservisi.com — Kıbrıs Haşere (Next.js :3020)
# Sertifika: Cloudflare Origin veya certbot:
#   sudo certbot certonly --nginx -d alobocekservisi.com -d www.alobocekservisi.com

server {
    listen 80;
    listen [::]:80;
    server_name alobocekservisi.com www.alobocekservisi.com;
    return 301 https://alobocekservisi.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.alobocekservisi.com;

    ssl_certificate     /etc/nginx/ssl/alobocekservisi.com.pem;
    ssl_certificate_key /etc/nginx/ssl/alobocekservisi.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://alobocekservisi.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alobocekservisi.com;

    ssl_certificate     /etc/nginx/ssl/alobocekservisi.com.pem;
    ssl_certificate_key /etc/nginx/ssl/alobocekservisi.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    client_max_body_size 10M;

    location ~ ^/tr(/.*)?$ {
        return 301 https://$host$1;
    }

    location = /hizmetler/yilan-kontrolu { return 301 https://$host/hizmetler; }
    location = /blog/yilan-gorunce-kktc-rehberi { return 301 https://$host/blog; }
    location = /en/hizmetler/yilan-kontrolu { return 301 https://$host/en/hizmetler; }
    location = /en/blog/yilan-gorunce-kktc-rehberi { return 301 https://$host/en/blog; }
    location = /ru/hizmetler/yilan-kontrolu { return 301 https://$host/ru/hizmetler; }
    location = /ru/blog/yilan-gorunce-kktc-rehberi { return 301 https://$host/ru/blog; }

    location ^~ /_next/image {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Content-Disposition;
        proxy_set_header Accept $http_accept;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header Vary "Accept" always;
    }

    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /images/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header CDN-Cache-Control "public, max-age=31536000" always;
    }

    # Kök statik dosyalar — /tr rewrite dışında (favicon, PWA ikonları)
    location ~ ^/(favicon\.ico|favicon-\d+\.png|icon|apple-icon\.png)$ {
        proxy_pass http://127.0.0.1:3020$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:3020/robots.txt;
        proxy_set_header Host $host;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3020/sitemap.xml;
        proxy_set_header Host $host;
    }

    location = /manifest.webmanifest {
        proxy_pass http://127.0.0.1:3020/manifest.webmanifest;
        proxy_set_header Host $host;
    }

    location = /llms.txt {
        proxy_pass http://127.0.0.1:3020/llms.txt;
        proxy_set_header Host $host;
    }

    location ~ ^/(en|ru)(/|$) {
        proxy_pass http://127.0.0.1:3020;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        # Cloudflare Email Obfuscation devre dışı (email-decode.min.js enjekte edilmez)
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400, no-transform" always;
        add_header CDN-Cache-Control "public, max-age=3600, no-transform" always;
    }

    location / {
        rewrite ^/$ /tr break;
        rewrite ^/(.+)$ /tr/$1 break;
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        # Cloudflare Email Obfuscation devre dışı (email-decode.min.js enjekte edilmez)
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400, no-transform" always;
        add_header CDN-Cache-Control "public, max-age=3600, no-transform" always;
    }

    access_log /var/log/nginx/alobocekservisi.com.access.log;
    error_log  /var/log/nginx/alobocekservisi.com.error.log;
}
