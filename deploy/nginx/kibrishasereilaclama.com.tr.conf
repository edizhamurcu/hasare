# kibrishasereilaclama.com.tr — eski alan adı → kanonik alobocekservisi.com
# Kurulum:
#   sudo ln -sf /path/to/hasere/deploy/nginx/kibrishasereilaclama.com.tr.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name kibrishasereilaclama.com.tr www.kibrishasereilaclama.com.tr;
    return 301 https://alobocekservisi.com$request_uri;
}
