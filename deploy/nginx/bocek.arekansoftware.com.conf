# bocek.arekansoftware.com — eski alan adı → kanonik alobocekservisi.com

server {
    listen 80;
    listen [::]:80;
    server_name bocek.arekansoftware.com;
    return 301 https://alobocekservisi.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bocek.arekansoftware.com;

    ssl_certificate     /etc/nginx/ssl/cf-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cf-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://alobocekservisi.com$request_uri;
}
